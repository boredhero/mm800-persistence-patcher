name: source-only tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile host tools
        run: python3 -m py_compile tools/*.py
      - name: Run source-only tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit repository artifacts
        run: python3 tests/test_repository.py
